[versions]
agp = "9.1.1"
cloudinaryAndroid = "3.1.2"
converterGson = "3.0.0"
junit = "4.13.2"
glide = "5.0.9"
compiler = "5.0.7"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
fragment = "1.9.0"
googleGmsGoogleServices = "4.5.0"
